# SwiftLint (CI runs `swiftlint lint --strict`).
included:
  - App
  - AppTests
  - AppUITests
  - Packages
excluded:
  - build
  - Packages/*/.build
disabled_rules:
  - trailing_comma
  # SwiftUI's own style passes several closures with trailing syntax (`Button {} label: {}`).
  - multiple_closures_with_trailing_closure
line_length:
  warning: 140
  ignores_comments: true
identifier_name:
  # Short names are idiomatic for loop indices, coordinates and closure parameters.
  min_length: 1
file_length:
  warning: 600
type_body_length:
  warning: 450
