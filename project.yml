# The Xcode project is generated from this file with XcodeGen
# (`xcodegen generate`): edit this file, not VettID.xcodeproj. CI checks
# that the committed project matches it.
name: VettID
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  groupSortPosition: top
configs:
  Debug: debug
  DevStack: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  DevStack: Config/DevStack.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

# One local package per Android core module (IOS-PLAN §5).
packages:
  VettIDCrypto:
    path: Packages/VettIDCrypto
  VettIDAttestation:
    path: Packages/VettIDAttestation
  VettIDRelay:
    path: Packages/VettIDRelay
  VettIDAltChan:
    path: Packages/VettIDAltChan
  VettIDVault:
    path: Packages/VettIDVault
  VettIDKeys:
    path: Packages/VettIDKeys
  VettIDData:
    path: Packages/VettIDData
  VettIDMedia:
    path: Packages/VettIDMedia
  VettIDNotify:
    path: Packages/VettIDNotify
  VettIDUI:
    path: Packages/VettIDUI
  VettIDOnboarding:
    path: Packages/VettIDOnboarding
  VettIDSettings:
    path: Packages/VettIDSettings
  VettIDShell:
    path: Packages/VettIDShell
  VettIDConnections:
    path: Packages/VettIDConnections
  VettIDMessages:
    path: Packages/VettIDMessages
  VettIDApprovals:
    path: Packages/VettIDApprovals
  VettIDNotifications:
    path: Packages/VettIDNotifications
  VettIDHistory:
    path: Packages/VettIDHistory
  VettIDItems:
    path: Packages/VettIDItems
  VettIDVotes:
    path: Packages/VettIDVotes
  # TEST ONLY: linked by test targets, never by the app (release check).
  VettIDTesting:
    path: Packages/VettIDTesting

targets:
  VettID:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, Sounds/SOURCE.md]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VettIDEnvironment: $(VETTID_ENVIRONMENT)
        VettIDAccountHost: $(VETTID_ACCOUNT_HOST)
        VettIDRelayHost: $(VETTID_RELAY_HOST)
        VettIDManifestHost: $(VETTID_MANIFEST_HOST)
        VettIDManifestKeys: $(VETTID_MANIFEST_KEYS)
        VettIDVotesHost: $(VETTID_VOTES_HOST)
        # A canary manifest (VAULT-RELEASES §10.1 step 9, VAULT-MESSAGING §11.10.1) is opened with VettID from Files, the
        # share sheet or AirDrop, in every configuration (the canary phone runs the release build). JSON is declared at
        # rank Alternate (VettID is never the default app for JSON) as a viewer; an opened file is copied in (not opened
        # in place), only verified and shown, and installed only after the member confirms (App/CanaryManifestFiles.swift).
        CFBundleDocumentTypes:
          - CFBundleTypeName: VettID release manifest
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        LSSupportsOpeningDocumentsInPlace: false
        # The relay page's "Open in VettID" link for any relay, self-hosted ones included: vettid://connect#<link>
        # (VAULT-MESSAGING §6.4, IOS-PLAN §6.8), in every configuration as on Android. Nothing is sent before the member
        # confirms on the accept screen.
        CFBundleURLTypes:
          - CFBundleURLName: org.vettid.connect
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [vettid]
    # The entitlements of every configuration, written by XcodeGen. App Attest's production environment (IOS-PLAN §6.2):
    # the vault refuses the development one, and TestFlight and App Store builds are always production. The Universal
    # Link of invitations, https://relay.vettid.org/connect (IOS-PLAN §6.8, RELAY-PROTOCOL): iOS verifies the domain
    # once the relay serves its apple-app-site-association for this App ID (path /connect); until then such a link opens
    # in the browser, whose relay page offers vettid://connect.
    entitlements:
      path: Config/VettID-production.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
        com.apple.developer.associated-domains:
          - applinks:relay.vettid.org
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETTID_APP_BUNDLE_ID)
        PRODUCT_NAME: VettID
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(VETTID_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # No ITSAppUsesNonExemptEncryption: the export compliance answer for this app (its own encryption beyond the
        # system's) is the owner's to give, in App Store Connect for each build until it is settled here.
        # The app icon: AppIcon (the owner-supplied VettID app icon, used as is) in Release; AppIcon-NonProduction (the
        # same with vettid-android's white band) in every other configuration (Config/*.xcconfig, scripts/app-icon.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: $(VETTID_APP_ICON)
        # The camera for QR codes (the setup code, an invitation) and message photos (IOS-PLAN §8 I2.4); adding a saved photo
        # to the library, the add-only permission, asked only after the warning (IOS-PLAN §4). Choosing photos needs no
        # permission (the system's picker). (chosen; not in the spec: vettid-android has no such texts.)
        INFOPLIST_KEY_NSCameraUsageDescription: "VettID uses the camera to scan QR codes, such as your setup code or an invitation, and to take photos you send. Nothing is recorded, and a photo stays in memory until you send it."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "VettID adds a photo to your library only when you choose Save to phone."
        # Face ID for the app lock (IOS-PLAN ID17; chosen; not in the spec: vettid-android has no such text).
        INFOPLIST_KEY_NSFaceIDUsageDescription: "VettID uses Face ID only to open the app when you turn on the app lock."
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        # The entitlements above, in every configuration.
        CODE_SIGN_ENTITLEMENTS: Config/VettID-production.entitlements
    dependencies:
      - package: VettIDCrypto
      - package: VettIDAttestation
      - package: VettIDRelay
      - package: VettIDAltChan
      - package: VettIDVault
      - package: VettIDKeys
      - package: VettIDData
      - package: VettIDMedia
      - package: VettIDNotify
      - package: VettIDUI
      - package: VettIDOnboarding
      - package: VettIDSettings
      - package: VettIDShell
      - package: VettIDConnections
      - package: VettIDMessages
      - package: VettIDApprovals
      - package: VettIDNotifications
      - package: VettIDHistory
      - package: VettIDItems
      - package: VettIDVotes

  # TEST ONLY: the app's sources and screens against the local dev stack on the simulator (IOS-PLAN §8 exit I1 (a)),
  # with VettIDAltChanTesting's TEST App Attest attester and VettIDKeysTesting's software keys composed by
  # AppDevStack/DevStackWiring.swift, which only this target compiles. Built in the DevStack configuration only (the
  # file's #error refuses every other one), by the VettIDDevStack scheme only; never in an archive (SKIP_INSTALL) nor in
  # the VettID or Staging schemes (scripts/release-check.sh).
  VettIDDevStack:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, Sounds/SOURCE.md]
      - path: AppDevStack
        excludes: [Info.plist]
    info:
      path: AppDevStack/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VettIDEnvironment: $(VETTID_ENVIRONMENT)
        VettIDAccountHost: $(VETTID_ACCOUNT_HOST)
        VettIDRelayHost: $(VETTID_RELAY_HOST)
        VettIDManifestHost: $(VETTID_MANIFEST_HOST)
        VettIDManifestKeys: $(VETTID_MANIFEST_KEYS)
        VettIDVotesHost: $(VETTID_VOTES_HOST)
        # The dev stack's member API and relay are plain HTTP on the Mac's 127.0.0.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Its own bundle id, beside the VettID app built in the DevStack configuration (com.vettid.app.devstack).
        PRODUCT_BUNDLE_IDENTIFIER: com.vettid.app.devstack.ui
        PRODUCT_NAME: VettIDDevStack
        # The simulator only: an app with software keys and the TEST attester is never built for an iPhone or a Mac
        # (scripts/release-check.sh checks these).
        SUPPORTED_PLATFORMS: iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(VETTID_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The non-production icon in its DevStack configuration (Config/DevStack.xcconfig).
        ASSETCATALOG_COMPILER_APPICON_NAME: $(VETTID_APP_ICON)
        INFOPLIST_KEY_NSCameraUsageDescription: "VettID uses the camera to scan QR codes, such as your setup code or an invitation, and to take photos you send. Nothing is recorded, and a photo stays in memory until you send it."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "VettID adds a photo to your library only when you choose Save to phone."
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
      configs:
        DevStack:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) VETTID_DEVSTACK_APP
    dependencies:
      - package: VettIDCrypto
      - package: VettIDAttestation
      - package: VettIDRelay
      - package: VettIDAltChan
      - package: VettIDVault
      - package: VettIDKeys
      - package: VettIDData
      - package: VettIDMedia
      - package: VettIDNotify
      - package: VettIDUI
      - package: VettIDOnboarding
      - package: VettIDSettings
      - package: VettIDShell
      - package: VettIDConnections
      - package: VettIDMessages
      - package: VettIDApprovals
      - package: VettIDNotifications
      - package: VettIDHistory
      - package: VettIDItems
      - package: VettIDVotes
      # TEST ONLY: the TEST iOS attester and the software keys.
      - package: VettIDAltChan
        product: VettIDAltChanTesting
      - package: VettIDKeys
        product: VettIDKeysTesting

  VettIDTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETTID_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VettID
      - package: VettIDTesting

  # UI tests, never part of an archive: screenshots of the debug gallery (VettIDScreenshots scheme) and the
  # staging end-to-end tests on a real iPhone (VettIDStagingUITests scheme, scripts/staging-ui-test.sh). Not run by CI.
  VettIDAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETTID_APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VettID

  # TEST ONLY: DevStackTests against the VettIDDevStack app and the local dev stack (scripts/devstack-test.sh --ui).
  VettIDDevStackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests/VaultUITestCase.swift
      - path: AppDevStackUITests
        excludes: ["*.xctestplan"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vettid.app.devstack.ui.uitests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: iphonesimulator
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: VettIDDevStack

schemes:
  VettID:
    build:
      targets:
        VettID: all
        VettIDTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VettIDTests
        - package: VettIDCrypto/VettIDCryptoTests
        - package: VettIDAttestation/VettIDAttestationTests
        - package: VettIDRelay/VettIDRelayTests
        - package: VettIDAltChan/VettIDAltChanTests
        - package: VettIDVault/VettIDVaultTests
        - package: VettIDKeys/VettIDKeysTests
        - package: VettIDData/VettIDDataTests
        - package: VettIDMedia/VettIDMediaTests
        - package: VettIDNotify/VettIDNotifyTests
        - package: VettIDUI/VettIDUITests
        - package: VettIDOnboarding/VettIDOnboardingTests
        - package: VettIDOnboarding/VettIDOnboardingUITests
        - package: VettIDSettings/VettIDSettingsTests
        - package: VettIDSettings/VettIDSettingsUITests
        - package: VettIDShell/VettIDShellTests
        - package: VettIDShell/VettIDShellUITests
        - package: VettIDConnections/VettIDConnectionsTests
        - package: VettIDConnections/VettIDConnectionsUITests
        - package: VettIDMessages/VettIDMessagesTests
        - package: VettIDMessages/VettIDMessagesUITests
        - package: VettIDApprovals/VettIDApprovalsTests
        - package: VettIDApprovals/VettIDApprovalsUITests
        - package: VettIDNotifications/VettIDNotificationsTests
        - package: VettIDNotifications/VettIDNotificationsUITests
        - package: VettIDHistory/VettIDHistoryTests
        - package: VettIDHistory/VettIDHistoryUITests
        - package: VettIDItems/VettIDItemsTests
        - package: VettIDItems/VettIDItemsUITests
        - package: VettIDVotes/VettIDVotesTests
        - package: VettIDVotes/VettIDVotesUITests
        - package: VettIDTesting/VettIDTestingTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The app-hosted tests alone, for a real iPhone (the package test bundles cannot run on a device): the Secure Enclave
  # and App Attest tests, skipped where there is no such hardware.
  VettIDDevice:
    build:
      targets:
        VettID: all
        VettIDTests: [test]
    test:
      config: Debug
      targets:
        - VettIDTests

  VettIDScreenshots:
    build:
      targets:
        VettID: all
        VettIDAppUITests: [test]
    test:
      config: Debug
      targets:
        - name: VettIDAppUITests
          skippedTests: [StagingTests]

  # The staging end-to-end tests (STAGING-TESTING §3, §5) against the Staging build on a real iPhone, through
  # scripts/staging-ui-test.sh; each test is skipped without its inputs. The UI test bundle is built for testing only,
  # never archived.
  VettIDStagingUITests:
    build:
      targets:
        VettID: all
        VettIDAppUITests: [test]
    run:
      config: Staging
    test:
      config: Staging
      # The test plan sets the screen capture to screenshots: XCTest's screen recording would make the app's capture
      # hiding (IOS-PLAN §6.4, always on) cover the whole app. It runs VettIDAppUITests without GalleryScreenshots.
      testPlans:
        - path: AppUITests/StagingUITests.xctestplan
          defaultPlan: true
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  # IOS-PLAN §8 exit I1 (a): the VettIDDevStack app and its UI test on the simulator against the local dev stack, in the
  # DevStack configuration only, through scripts/devstack-test.sh --ui (each test is skipped without the stack's inputs).
  VettIDDevStack:
    build:
      targets:
        VettIDDevStack: all
        VettIDDevStackUITests: [test]
    run:
      config: DevStack
    test:
      config: DevStack
      # Screenshots, not XCTest's screen recording, which the app's capture hiding (IOS-PLAN §6.4) would cover.
      testPlans:
        - path: AppDevStackUITests/DevStackUITests.xctestplan
          defaultPlan: true
    profile:
      config: DevStack
    analyze:
      config: DevStack
    archive:
      config: DevStack
