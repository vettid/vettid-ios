# The Xcode project is generated from this file with XcodeGen
# (`xcodegen generate`): edit this file, not VettID.xcodeproj. CI checks
# that the committed project matches it.
name: VettID
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  groupSortPosition: top
configs:
  Debug: debug
  DevStack: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  DevStack: Config/DevStack.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

# One local package per Android core module (IOS-PLAN §5).
packages:
  VettIDCrypto:
    path: Packages/VettIDCrypto
  VettIDAttestation:
    path: Packages/VettIDAttestation
  VettIDRelay:
    path: Packages/VettIDRelay
  VettIDAltChan:
    path: Packages/VettIDAltChan
  VettIDVault:
    path: Packages/VettIDVault
  VettIDKeys:
    path: Packages/VettIDKeys
  VettIDData:
    path: Packages/VettIDData
  VettIDMedia:
    path: Packages/VettIDMedia
  VettIDNotify:
    path: Packages/VettIDNotify
  VettIDUI:
    path: Packages/VettIDUI
  VettIDOnboarding:
    path: Packages/VettIDOnboarding
  VettIDSettings:
    path: Packages/VettIDSettings
  VettIDShell:
    path: Packages/VettIDShell
  # TEST ONLY: linked by test targets, never by the app (release check).
  VettIDTesting:
    path: Packages/VettIDTesting

targets:
  VettID:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VettIDEnvironment: $(VETTID_ENVIRONMENT)
        VettIDAccountHost: $(VETTID_ACCOUNT_HOST)
        VettIDRelayHost: $(VETTID_RELAY_HOST)
        VettIDManifestHost: $(VETTID_MANIFEST_HOST)
        VettIDManifestKeys: $(VETTID_MANIFEST_KEYS)
        # A canary manifest (VAULT-RELEASES §10.1 step 9, VAULT-MESSAGING §11.10.1) is opened with VettID from Files, the
        # share sheet or AirDrop, in every configuration (the canary phone runs the release build). JSON is declared at
        # rank Alternate (VettID is never the default app for JSON) as a viewer; an opened file is copied in (not opened
        # in place), only verified and shown, and installed only after the member confirms (App/CanaryManifestFiles.swift).
        CFBundleDocumentTypes:
          - CFBundleTypeName: VettID release manifest
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETTID_APP_BUNDLE_ID)
        PRODUCT_NAME: VettID
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(VETTID_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The camera for QR codes (chosen; not in the spec: vettid-android has no such text).
        INFOPLIST_KEY_NSCameraUsageDescription: "VettID uses the camera only to scan QR codes, such as your setup code. Nothing is recorded."
        # Face ID for the app lock (IOS-PLAN ID17; chosen; not in the spec: vettid-android has no such text).
        INFOPLIST_KEY_NSFaceIDUsageDescription: "VettID uses Face ID only to open the app when you turn on the app lock."
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        # App Attest's production environment in every configuration (IOS-PLAN §6.2): the vault refuses the development
        # one, and TestFlight and App Store builds are always production.
        CODE_SIGN_ENTITLEMENTS: Config/VettID-production.entitlements
    dependencies:
      - package: VettIDCrypto
      - package: VettIDAttestation
      - package: VettIDRelay
      - package: VettIDAltChan
      - package: VettIDVault
      - package: VettIDKeys
      - package: VettIDData
      - package: VettIDMedia
      - package: VettIDNotify
      - package: VettIDUI
      - package: VettIDOnboarding
      - package: VettIDSettings
      - package: VettIDShell

  VettIDTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETTID_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VettID
      - package: VettIDTesting

  # Screenshots of the debug gallery for review (VettIDScreenshots scheme; not run by CI).
  VettIDAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VETTID_APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VettID

schemes:
  VettID:
    build:
      targets:
        VettID: all
        VettIDTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VettIDTests
        - package: VettIDCrypto/VettIDCryptoTests
        - package: VettIDAttestation/VettIDAttestationTests
        - package: VettIDRelay/VettIDRelayTests
        - package: VettIDAltChan/VettIDAltChanTests
        - package: VettIDVault/VettIDVaultTests
        - package: VettIDKeys/VettIDKeysTests
        - package: VettIDData/VettIDDataTests
        - package: VettIDMedia/VettIDMediaTests
        - package: VettIDNotify/VettIDNotifyTests
        - package: VettIDUI/VettIDUITests
        - package: VettIDOnboarding/VettIDOnboardingTests
        - package: VettIDOnboarding/VettIDOnboardingUITests
        - package: VettIDSettings/VettIDSettingsTests
        - package: VettIDSettings/VettIDSettingsUITests
        - package: VettIDShell/VettIDShellTests
        - package: VettIDShell/VettIDShellUITests
        - package: VettIDTesting/VettIDTestingTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The app-hosted tests alone, for a real iPhone (the package test bundles cannot run on a device): the Secure Enclave
  # and App Attest tests, skipped where there is no such hardware.
  VettIDDevice:
    build:
      targets:
        VettID: all
        VettIDTests: [test]
    test:
      config: Debug
      targets:
        - VettIDTests

  VettIDScreenshots:
    build:
      targets:
        VettID: all
        VettIDAppUITests: [test]
    test:
      config: Debug
      targets:
        - VettIDAppUITests
