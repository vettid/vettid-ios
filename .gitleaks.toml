# gitleaks configuration for vettid-ios. Extends the default ruleset.
#
# The only allowlisted values are public or fixed test-only values the generic rule mistakes for keys:
# - VAULT-MESSAGING §16 vector values that vettid-vault and vettid-android allowlist too (their .gitleaks.toml): HPKE
#   intermediate values derived from the public all-0x05 key seed and all-0x07 encapsulation randomness (hpke.json
#   shared_secret_hex, key_hex, exporter_secret_hex); the PUBLIC keys (SPKI) of the release-update test keys
#   (release.json) and of the test app key (appkey.json); release R's derived values from the fixed test inputs
#   (unlock.json unlock keys and secret checks, recovery.json's browser public key and secrets hash) and the example
#   passwords of verdicts.json. They live in Packages/VettIDCrypto/Tests/VettIDCryptoTests/Resources/vectors (copied
#   from vettid-vault, IOS-PLAN §7) and in the tests.
# - The iPhone unlock secrets, unlock keys and secret checks of the phone_ios.json reference (VettIDData tests),
#   derived from fixed repeating-byte test keys (scripts/phone-ios-reference).
# - The PUBLIC staging release-manifest key A (SPKI) in Config/Debug.xcconfig and Config/Staging.xcconfig.
# Reviewed findings in the v1 history are in .gitleaksignore.
[extend]
useDefault = true

[allowlist]
description = "VAULT-MESSAGING §16 test vectors (test-only, public)"
regexTarget = "match"
