name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its run on the way. On master a run is
# never cancelled: it finishes, and of the merges after it only the latest
# waits and runs, so every finished master run tests the code as merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    # Lint, the pure packages' tests on macOS, the app and package tests on a
    # simulator, and the release check. Touches no signing material: the
    # Release and Staging archives are built unsigned. The run takes about an
    # hour on the hosted runner; the limit leaves room above that.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: xcodebuild -version && swift --version
      - name: install SwiftLint 0.65.1 and XcodeGen 2.46.0 (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSLo swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          curl -sSLo xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          shasum -a 256 -c - <<'EOF'
          c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip
          4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip
          EOF
          unzip -q swiftlint.zip -d swiftlint && unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/tools/swiftlint" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: the Xcode project matches project.yml
        run: |
          xcodegen generate --quiet
          git diff --exit-code -- VettID.xcodeproj App/Info.plist
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: pure packages (swift test on macOS)
        run: |
          for p in VettIDCrypto VettIDAttestation VettIDRelay VettIDAltChan VettIDVault VettIDKeys VettIDTesting; do
            echo "::group::$p"
            swift test --package-path "Packages/$p"
            echo "::endgroup::"
          done
      - name: app and package tests (simulator)
        run: |
          xcodebuild test -project VettID.xcodeproj -scheme VettID \
            -destination "$(scripts/simulator-destination.sh)" \
            -parallel-testing-worker-count 2 \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/VettID.xcresult
      - name: release check (Release and Staging carry no TEST, dev-stack or other-environment strings)
        run: scripts/release-check.sh --self-test
      # Best effort: the result bundle helps diagnose a failure, but an upload that fails (GitHub's artifact service
      # unreachable) says nothing about the app and must not fail a required check.
      - name: results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results
          path: build/VettID.xcresult
          if-no-files-found: ignore
          retention-days: 14

  calls-webrtc:
    # The calls' WebRTC media engine (Packages/VettIDCallsWebRTC), on its own: no app target links it, and it is not in the
    # Xcode project, so the `ios` job never resolves its 686 MB binary. Its tests run on macOS (swift test) and on a
    # simulator (the iOS-only ones). The binary is cached, keyed on Package.swift (which holds its checksum) and Package.resolved.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the media stack's binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Packages/VettIDCallsWebRTC/.build/artifacts
            Packages/VettIDCallsWebRTC/build/DerivedData/SourcePackages/artifacts
            ~/Library/Caches/org.swift.swiftpm
          key: webrtc-binary-${{ hashFiles('Packages/VettIDCallsWebRTC/Package.swift', 'Packages/VettIDCallsWebRTC/Package.resolved') }}
      - name: swift test (macOS)
        run: swift test --package-path Packages/VettIDCallsWebRTC
      - name: tests on a simulator (the iOS-only ones included)
        run: |
          cd Packages/VettIDCallsWebRTC
          xcodebuild test -scheme VettIDCallsWebRTC \
            -destination "$(../../scripts/simulator-destination.sh)" \
            -derivedDataPath build/DerivedData -parallel-testing-worker-count 2

  gitleaks:
    # Pinned binary over the FULL history (the gitleaks-action fails on a
    # branch's first push, where there is no "before" commit). Reviewed findings
    # in the v1 history are listed in .gitleaksignore.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --verbose .
