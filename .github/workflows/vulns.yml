name: vulns

# Vulnerability scanning. It reports; it never changes a dependency.
#
# - osv-scanner v2.7.0 (checksum-verified binary) over every Package.resolved
#   in the repository. The app's (VettID.xcodeproj/.../Package.resolved) pins
#   what ships, so a finding there fails the job. Every other one (each
#   package's own) is used only to build and test that package on its own,
#   and may pin other versions; a finding there is a warning and goes in the
#   weekly issue. The WebRTC framework (Packages/VettIDCallsWebRTC) is a binary
#   target that no Package.resolved lists, so it is not covered here.
# - govulncheck v1.9.0 over each Go module in scripts/ (reference and test-PKI
#   generators; none is built into the app), with the Go each module's go.mod
#   names, against vettid-vault's main (GOFLAGS=-mod=mod, so a newer vault
#   dependency adjusts the throwaway go.mod instead of failing the load). They
#   are tooling, so a vulnerability their code reaches is listed as a warning
#   and in the weekly issue, not failed. Go tooling built inside the
#   vettid-vault module (scripts/devattest-verify, scripts/devstack-test.sh)
#   is covered by vettid-vault's own scanning.
#
# On pull requests and pushes to master, and weekly and on demand to catch
# advisories published after the last change. On master, a scheduled or manual
# run with a finding opens one issue, or comments on the one already open; a
# clean run closes it.
#
# Actions are pinned by commit SHA (tag in the comment).

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is in the group, so a push to master never displaces the
  # scheduled run that updates the issue.
  group: vulns-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scanner:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.packages.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install osv-scanner v2.7.0 (checksum-verified)
        run: |
          curl -sSLo osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: the app's Package.resolved (what ships; a finding fails)
        run: |
          app=VettID.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f "$app" || { echo "::error::$app not found"; exit 1; }
          ./osv-scanner scan source -L "$app"
      - name: every other Package.resolved (standalone builds; a finding is listed)
        id: packages
        # Also after an app finding, so both are in the log and the issue.
        if: ${{ !cancelled() }}
        run: |
          app=VettID.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          args=()
          while IFS= read -r f; do
            [ "$f" = "$app" ] || args+=(-L "$f")
          done < <(git ls-files '*Package.resolved')
          if [ "${#args[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No other Package.resolved."
            exit 0
          fi
          echo "Scanning $(( ${#args[@]} / 2 )) other Package.resolved files."
          rc=0
          ./osv-scanner scan source "${args[@]}" || rc=$?
          case $rc in
            0) echo "found=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "found=true" >> "$GITHUB_OUTPUT"
               echo "::warning::osv-scanner: a package's own Package.resolved pins a vulnerable version (standalone builds only, not what the app ships; see the log)" ;;
            *) echo "::error::osv-scanner could not scan the packages (exit $rc)"
               exit 1 ;;
          esac

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      found: ${{ steps.scan.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vettid-ios
          persist-credentials: false
      # Two of the modules replace github.com/vettid/vettid-vault with
      # ../../../vettid-vault, a checkout beside this repository's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vettid/vettid-vault
          path: vettid-vault
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: govulncheck v1.9.0 over each module in scripts/
        id: scan
        working-directory: vettid-ios
        run: |
          # Installed and run as a binary: "go run" would turn its exit 3
          # (a vulnerability the code reaches) into exit 1.
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          found=false
          for mod in $(git ls-files 'scripts/*/go.mod'); do
            dir=$(dirname "$mod")
            # The Go the module names: its toolchain line, else its go line.
            v=$(sed -n 's/^toolchain go//p' "$mod")
            [ -n "$v" ] || v=$(sed -n 's/^go //p' "$mod")
            # A module that uses the vault needs at least the Go the vault's
            # go.mod names, or a Go bump there would fail the load.
            if grep -q '^replace github.com/vettid/vettid-vault' "$mod"; then
              vv=$(sed -n 's/^toolchain go//p' ../vettid-vault/go.mod)
              [ -n "$vv" ] || vv=$(sed -n 's/^go //p' ../vettid-vault/go.mod)
              v=$(printf '%s\n' "$v" "$vv" | sort -V | tail -1)
            fi
            # A bare "go 1.26" names no toolchain that can be downloaded.
            case $v in *.*.*) ;; *) v="$v.0" ;; esac
            echo "::group::$dir (go$v)"
            rc=0
            (cd "$dir" && GOFLAGS=-mod=mod GOTOOLCHAIN="go$v" "$RUNNER_TEMP/bin/govulncheck" -show verbose ./...) || rc=$?
            echo "::endgroup::"
            case $rc in
              0) ;;
              3) found=true
                 echo "::warning::govulncheck: $dir's code reaches a vulnerability (tooling only, not in the app; see the log)" ;;
              *) echo "::error::govulncheck could not scan $dir (exit $rc)"
                 exit 1 ;;
            esac
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

  issue:
    # One issue for all findings: opened, or commented on while open; a clean
    # run closes it. Only for scheduled and manual runs on master. A cancelled
    # run reports nothing; a scan that couldn't run is reported as such.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [osv-scanner, govulncheck]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OSV: ${{ needs.osv-scanner.result }}
          OSV_PACKAGES: ${{ needs.osv-scanner.outputs.packages }}
          GOVULN: ${{ needs.govulncheck.result }}
          GOVULN_FOUND: ${{ needs.govulncheck.outputs.found }}
        run: |
          what=""
          if [ "$OSV" != success ]; then
            what="$what
          - osv-scanner: a vulnerability in a Swift dependency the app ships, or the scan could not run (the job log names it)."
          fi
          if [ "$OSV_PACKAGES" = true ]; then
            what="$what
          - osv-scanner: a package's own Package.resolved (its standalone build, not the app) pins a vulnerable version (the job log names it)."
          fi
          if [ "$GOVULN" != success ]; then
            what="$what
          - govulncheck: the scan of a Go module in scripts/ could not run (the job log names it)."
          elif [ "$GOVULN_FOUND" = true ]; then
            what="$what
          - govulncheck: a Go module in scripts/ (tooling, not in the app) reaches a vulnerability (the job log names it)."
          fi
          title="security: vulnerability scan findings"
          gh label create security --color B60205 --description "Security findings" 2>/dev/null || true
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$what" ]; then
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "Found again: $RUN$what"
              gh issue edit "$n" --add-label security
            else
              gh issue create --title "$title" --label security --body "The vulnerability scan on master (.github/workflows/vulns.yml) found:$what

          See $RUN."
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Clean on master: $RUN"
          fi
